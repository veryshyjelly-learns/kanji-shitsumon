[package]
name = "kanji_shitsumon"
version = "0.1.0"
authors = ["Ayush Biswas <biswas.ayush03@kgpian.iitkgp.ac.in>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
csv = "1.4.0"
dioxus = { version = "0.7.1", features = [] }
dioxus-asset-resolver = { version = "0.7.3", features = ["native"] }
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
